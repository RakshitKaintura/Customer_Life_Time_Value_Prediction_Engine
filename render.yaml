# ============================================================
# Render.com deployment configuration
# ============================================================

services:
  # ── FastAPI Scoring API ────────────────────────────────────
  - type: web
    name: ltv-prediction-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install ".[ml]"
    startCommand: |
      python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key:   ENVIRONMENT
        value: production
      - key:   LOG_LEVEL
        value: INFO
      - key:   DISABLE_HEAVY_MODELS
        value: "true"
      - key:   SUPABASE_URL
        sync:  false
      - key:   SUPABASE_SERVICE_ROLE_KEY
        sync:  false
      - key:   DATABASE_URL
        sync:  false
      - key:   DATABASE_URL_ASYNC
        sync:  false
      - key:   API_SECRET_KEY
        generateValue: true
      - key:   AIRTABLE_API_TOKEN
        sync:  false
      - key:   AIRTABLE_BASE_ID
        sync:  false
      - key:   AIRTABLE_TABLE_ID
        sync:  false
      - key:   SEGMENT_WRITE_KEY
        sync:  false
      - key:   GOOGLE_ADS_DEVELOPER_TOKEN
        sync:  false
      - key:   META_ACCESS_TOKEN
        sync:  false
      - key:   WANDB_API_KEY
        sync:  false
      - key:   MODELS_DIR
        value: ./models
      - key:   ONNX_PATH
        value: ./models/transformer.onnx

  - type: worker
    name: ltv-dagster-daemon
    runtime: python
    buildCommand: uv pip install --system -e ".[orchestration]"
    startCommand: dagster-daemon run
    envVars:
      - key: DAGSTER_HOME
        value: /tmp/dagster_home

